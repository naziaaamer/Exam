name: CI integration

on:
  push:
    branches: ["master", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "dev"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1 Pick up the code
      - name: pick the code from repo
        uses: actions/checkout@v4

      # 2 run the python
      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3 run dependencies
      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 

      # 4. Install Playwright Chromium and system dependencies
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # 5 Linting
      - name: Lint code with flake8
        run: flake8 src tests --max-line-length=120

      # 6 run tests
      - name: Run backend tests with pytest
        run: pytest --maxfail=1 --disable-warnings -q

      # 7 run frontend E2E tests
      - name: Run E2E tests with behave
        run:  python -m behave src/features

      # 8. Install packaging tool
      - name: Install build tools
        run: python -m pip install --upgrade build

      # 9. Build Python package
      - name: Build Bookstore package
        run: python -m build

      # 10. Upload package to GitHub
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
              name: bookstore-package
              path: dist/
              if-no-files-found: error