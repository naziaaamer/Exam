[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-bookstore"
version = "0.1.0"
description = "Bookstore application with book catalogue and favourites"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bookstore*"]
namespaces = false